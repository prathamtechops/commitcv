name: PR branch up-to-date check

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  verify-up-to-date:
    name: Verify branch is up to date with dev
    runs-on: ubuntu-latest
    steps:
      - name: Compare the PR branch with the latest dev commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "commitcv-pr-up-to-date-check",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github_api(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/{path}",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  details = error.read().decode("utf-8", errors="replace")
                  print(
                      f"GitHub API request failed with status {error.code}: {details}",
                      file=sys.stderr,
                  )
                  raise

          dev_ref = github_api("git/ref/heads/dev")
          dev_sha = dev_ref["object"]["sha"]
          comparison = github_api(f"compare/{dev_sha}...{head_sha}")
          status = comparison["status"]

          if status not in {"ahead", "identical"}:
              print(
                  "This pull request branch does not contain the latest dev commit.",
                  file=sys.stderr,
              )
              print(f"Comparison status: {status}", file=sys.stderr)
              print("Update the branch and push it again:", file=sys.stderr)
              print("  git fetch origin dev", file=sys.stderr)
              print("  git merge origin/dev", file=sys.stderr)
              print("  git push", file=sys.stderr)
              sys.exit(1)

          print(
              "The pull request branch contains the latest dev commit "
              f"({dev_sha[:7]})."
          )
          PY
